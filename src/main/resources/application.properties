spring.application.name=backend

server.port=${PORT:8080}

# 로컬 실행: 별도 DB 설치 없이 파일에 저장
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/emori;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true

spring.jackson.time-zone=Asia/Seoul
spring.mvc.problemdetails.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never

# TODO: API 명세서 확정 후 수정
emori.cors-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

emori.session-hours=${SESSION_HOURS:24}

# 시연용 유료 권한/기본값은 비활성화
emori.demo.enabled=${DEMO_ENABLED:false}
emori.demo.premium-logins=${DEMO_PREMIUM_LOGINS:}

emori.push.enabled=${PUSH_ENABLED:false}
emori.push.public-key=${VAPID_PUBLIC_KEY:}
emori.push.private-key=${VAPID_PRIVATE_KEY:}
emori.push.subject=${VAPID_SUBJECT:}

